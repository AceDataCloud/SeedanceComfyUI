[project]
name = "ace-seedance"
version = "0.1.0"
description = "Seedance video generation, same-task lookup, and native video loading through Ace Data Cloud"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "jsonschema>=4,<5"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/AceDataCloud/SeedanceComfyUI"
Documentation = "https://github.com/AceDataCloud/SeedanceComfyUI#readme"
"Bug Tracker" = "https://github.com/AceDataCloud/SeedanceComfyUI/issues"

[tool.comfy]
PublisherId = "acedatacloud"
DisplayName = "Seedance by Ace Data Cloud"
Icon = "https://raw.githubusercontent.com/AceDataCloud/SeedanceComfyUI/main/assets/logo-400.png"
